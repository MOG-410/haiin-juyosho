<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<title>拝印授与所</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

background:
radial-gradient(circle,#385738,#050605);

font-family:serif;
color:white;

}


/* 牢壁 */

.wall{

position:fixed;
inset:0;

background:

linear-gradient(
90deg,
rgba(0,0,0,.75),
transparent,
rgba(0,0,0,.75)
),

repeating-linear-gradient(
90deg,
rgba(80,75,50,.35) 0px,
rgba(80,75,50,.35) 7px,
transparent 7px,
transparent 75px
);

}


/* 爪痕 */

.scratch{

position:fixed;

left:12%;
top:38%;

width:130px;
height:90px;

opacity:.5;

background:

repeating-linear-gradient(
-20deg,
transparent 0px,
transparent 14px,
rgba(255,255,255,.12) 15px,
transparent 18px
);

}



/* 中央 */

.content{

position:relative;
z-index:2;

width:320px;

padding:40px 30px;

text-align:center;

background:

rgba(10,20,10,.92);

border:

2px solid #b69b58;


box-shadow:

0 0 50px rgba(150,210,100,.4);

}



.title{

font-size:32px;

letter-spacing:8px;

color:#ead38b;

}



.text{

margin:25px 0;

line-height:2;

color:#ccc;

}



.mark{

font-size:90px;

filter:
drop-shadow(0 0 25px #a8df70);

animation:

float 3s infinite;

}



@keyframes float{

50%{

transform:translateY(-10px);

}

}




button{

padding:15px 40px;

background:#263d28;

color:#ead38b;

border:

1px solid #c9b36b;

font-size:18px;

font-family:serif;

cursor:pointer;

transition:.3s;

}



button:hover{

box-shadow:

0 0 35px #a8df70;

transform:scale(1.05);

}




/* 檻 */

.door{

position:fixed;

top:0;

height:100vh;

width:50%;

z-index:5;

pointer-events:none;


background:

repeating-linear-gradient(

90deg,

#111 0px,

#111 15px,

#555 15px,

#555 18px,

transparent 18px,

transparent 60px

);


border:

10px solid #332f1c;


transition:

transform 2s cubic-bezier(.7,0,.3,1);

}


#leftDoor{

left:0;

}


#rightDoor{

right:0;

}


.openLeft{

transform:translateX(-100%);

}


.openRight{

transform:translateX(100%);

}




/* 波紋 */

.ripple{

position:fixed;

left:50%;
top:50%;

width:50px;

height:50px;

border-radius:50%;

border:

2px solid rgba(170,255,120,.7);

opacity:0;

}



.ripple.show{

animation:

ripple 2s;

}



@keyframes ripple{

100%{

opacity:0;

transform:

translate(-50%,-50%)

scale(25);

}

}




/* 光 */

.light{

position:fixed;

left:50%;
top:50%;

width:50px;

height:50px;

background:#caff8a;

border-radius:50%;

opacity:0;

}



.light.show{

animation:

light 1.5s;

}



@keyframes light{

0%{

opacity:1;

}

100%{

opacity:0;

transform:

translate(-50%,-50%)

scale(30);

}

}




/* タップ光 */

.touchLight{

position:fixed;

width:45px;

height:45px;

border-radius:50%;


background:

radial-gradient(
circle,
rgba(190,255,120,.9),
rgba(120,255,80,.3),
transparent 70%
);


pointer-events:none;


transform:

translate(-50%,-50%)
scale(0);


animation:

touchEffect .8s;


z-index:20;

}



@keyframes touchEffect{


0%{

opacity:1;

transform:

translate(-50%,-50%)
scale(0);

}


100%{

opacity:0;

transform:

translate(-50%,-50%)
scale(5);

}

}


</style>

</head>


<body>


<div class="wall"></div>

<div class="scratch"></div>

<div id="ripple" class="ripple"></div>

<div id="light" class="light"></div>



<div class="content">


<div class="title">

拝印授与所

</div>


<div class="text">

深き牢より脱獄せし神使より<br>

印を授ける

</div>


<div class="mark">

𐔌ŧ‹”𐦯

</div>


<button onclick="copyMark()">

拝印を授かる

</button>


<div id="message"></div>


</div>




<div id="leftDoor" class="door"></div>

<div id="rightDoor" class="door"></div>



<script>


// 開門

setTimeout(()=>{


document
.getElementById("leftDoor")
.classList.add("openLeft");


document
.getElementById("rightDoor")
.classList.add("openRight");



document
.getElementById("ripple")
.classList.add("show");


document
.getElementById("light")
.classList.add("show");



},1000);





// タップ光

document.addEventListener("pointerdown",function(e){


let light=document.createElement("div");


light.className="touchLight";


light.style.left=e.clientX+"px";

light.style.top=e.clientY+"px";


document.body.appendChild(light);



setTimeout(()=>{

light.remove();

},800);



});





function copyMark(){


navigator.clipboard.writeText("𐔌ŧ‹”𐦯");


document.getElementById("message").innerHTML=

"𐔌ŧ‹”𐦯 を授かりました";


}



</script>


</body>

</html>
